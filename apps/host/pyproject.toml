[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-azure-host"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "commerce-common[azure]==0.1.0.dev0",
  "shopping-agent-core==0.1.0.dev0",
  "merchant-agent-core==0.1.0.dev0",
  "shopping-agent-runtime==0.1.0.dev0",
  "merchant-agent-runtime==0.1.0.dev0",
  "fastapi>=0.132",
  "uvicorn>=0.30",
  "azure-cosmos>=4.9,<5",
  "azure-identity>=1.23,<2",
  "pyjwt[crypto]>=2.10,<3",
  "opentelemetry-api>=1.35,<2",
  "jsonschema>=4.26,<5",
  "tzdata>=2026.6",
]

[project.optional-dependencies]
telemetry = ["azure-monitor-opentelemetry>=1.8,<2"]

[tool.hatch.build.targets.wheel]
packages = ["commerce_host"]
