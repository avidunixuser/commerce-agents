[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=44",
  "azure-cosmos>=4.9,<5",
  "azure-identity>=1.20,<2",
]

[tool.setuptools.packages.find]
include = ["commerce_gateway*"]
