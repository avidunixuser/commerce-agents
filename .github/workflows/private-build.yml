name: Private image build

on:
  workflow_dispatch:
    inputs:
      images:
        description: Build the gateway smoke image, retail storefront, or all ten images
        type: choice
        required: true
        default: smoke
        options: [smoke, retail-storefront, all]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: commerce-private-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: commerce-build
    timeout-minutes: 210
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Load protected nonsecret configuration and verify OIDC claims
        env:
          BUILD_CONFIG: ${{ vars.COMMERCE_BUILD_CONFIG }}
        run: |
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"commerce-build.json"; p.write_text(json.dumps(json.loads(os.environ["BUILD_CONFIG"])))'
          python infra/scripts/private_build_github.py --config "$RUNNER_TEMP/commerce-build.json" verify-claims
      - name: Log in using the controller's federated identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build privately and remove the disposable VM
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          az bicep install --version v0.46.1
          mkdir -p .validation/private-build
          python infra/scripts/private_build.py --config "$RUNNER_TEMP/commerce-build.json" run \
            --source-sha "$GITHUB_SHA" --run-id "gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --images "$IMAGES" --state-file .validation/private-build/state.json \
            --approve-disposable-cleanup | tee .validation/private-build/result.log
      - name: Recover interrupted cleanup
        if: always()
        run: |
          if [ -f .validation/private-build/state.json ]; then
            python infra/scripts/private_build.py --config "$RUNNER_TEMP/commerce-build.json" cleanup \
              --state-file .validation/private-build/state.json --approve-disposable-cleanup
          fi
      - name: Preserve nonsecret digest and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .validation/private-build/
          if-no-files-found: ignore
          retention-days: 7
