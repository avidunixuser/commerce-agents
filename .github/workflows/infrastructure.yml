name: Infrastructure
on:
  pull_request:
    paths: ["infra/**", "deploy/helm/**", ".github/workflows/infrastructure.yml"]
  push:
    paths: ["infra/**", "deploy/helm/**", ".github/workflows/infrastructure.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install schema dependencies
        run: python -m pip install PyYAML==6.0.2
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - name: Install offline validators
        shell: bash
        run: |
          mkdir -p .tools/kubeconform
          curl --fail --location --silent --show-error https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o .tools/kubeconform.tar.gz
          curl --fail --location --silent --show-error https://github.com/yannh/kubeconform/releases/download/v0.6.7/CHECKSUMS -o .tools/kubeconform-checksums
          (cd .tools && grep ' kubeconform-linux-amd64.tar.gz$' kubeconform-checksums | sha256sum --check --strict)
          tar -xzf .tools/kubeconform.tar.gz -C .tools/kubeconform
          az bicep install --version v0.46.1
      - name: Compile Bicep and validate every vertical and CSI configuration
        run: python infra/scripts/validate.py --kubeconform .tools/kubeconform/kubeconform
      - name: Test fail-closed deployment inputs
        run: python -m unittest discover -s infra/scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-infrastructure-validation
          path: .validation/infra/
          retention-days: 7
