{{- range $name, $workload := .Values.workloads }}
{{- if $workload.secrets }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: {{ $name }}}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ $name }}-secrets
      type: Opaque
      data:
        {{- range $secret := $workload.secrets }}
        - {objectName: {{ $secret.alias }}, key: {{ $secret.alias }}}
        {{- end }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ $workload.clientId | quote }}
    keyvaultName: {{ required "vaultName is required for secrets" $.Values.vaultName | quote }}
    tenantId: {{ required "tenantId is required for secrets" $.Values.tenantId | quote }}
    objects: |
      array:
      {{- range $secret := $workload.secrets }}
        - |
          objectName: {{ $secret.remoteName }}
          objectAlias: {{ $secret.alias }}
          objectType: secret
          objectVersion: ""
      {{- end }}
{{- end }}
{{- end }}
